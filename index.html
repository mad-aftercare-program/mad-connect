  --red:#D60034; --green:#1A9461; --green-d:#13744c; --yellow:#EAE647; --purple:#CEA4CC;
  --canvas:#F5EFE3; --ink:#202124; --ink2:#55575b; --line:#dccfb6; --card:#fffdf7;
  --warn:#C2610C; --r:14px; --tap:48px;
  --serif:Georgia,"Playfair Display","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0;font-weight:700}
h1{font-size:clamp(28px,6vw,44px)}
h2{font-size:clamp(20px,3.6vw,26px)}
h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:10px 20px;border-radius:12px;border:2px solid var(--green);background:var(--green);color:#fff;font-weight:700;text-decoration:none}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:rgba(32,33,36,.07)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:10px 4px;color:var(--ink);text-decoration:underline;min-height:44px}

/* home */
.home{max-width:760px;margin:0 auto;padding:40px 18px 60px}
.home .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-weight:700}
.logo{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:20px 0 0 var(--green),40px 0 0 var(--yellow);margin-right:44px}
.home h1{margin-bottom:12px}
.home .lead{font-size:18px;color:var(--ink2);max-width:36em;margin-bottom:28px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:20px}
.chip{min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-weight:700;text-align:left}
.chip:hover{background:var(--yellow)}
.home .foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}

/* header + tabs */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .row{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{color:#fff;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .iconbtn{background:transparent;border:2px solid #fff5;color:#fff;border-radius:10px;min-height:44px;min-width:44px;padding:0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;line-height:1.4;border:0;white-space:nowrap}
.pill.sync{background:#ffffff1f;color:#fff;min-height:44px;font-weight:600;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--ink);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff22}
.tabs button{flex:1;min-height:58px;background:none;border:0;color:#d8d8d8;font-weight:600;font-size:14px;border-top:4px solid transparent}
.tabs button[aria-selected="true"]{color:#fff;border-top-color:var(--yellow)}
main.page{max-width:1100px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
@media(min-width:820px){
  .tabs{position:static;background:none;border:0;padding:0;width:auto}
  .tabs button{min-height:44px;border-radius:10px;border-top:0;padding:0 18px;flex:none}
  .tabs button[aria-selected="true"]{background:#ffffff26}
  main.page{padding-bottom:40px}
}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:820px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi .v{font-family:var(--serif);font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.1}
.kpi .l{color:var(--ink2);font-size:14px;margin-top:4px}
.two{grid-template-columns:1fr}
@media(min-width:820px){.two{grid-template-columns:3fr 2fr}}
.section{margin-top:22px}
.section>h3{margin-bottom:10px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--yellow);color:var(--ink);font-size:15px}
.banner.info{background:#e9e2d0}
.banner.bad{background:#fbd5dd}

/* status pills */
.s-connected{background:var(--green);color:#fff}
.s-slipping{background:var(--yellow);color:var(--ink)}
.s-atrisk{background:var(--warn);color:#fff}
.s-lost{background:var(--red);color:#fff}
.s-none{background:var(--purple);color:var(--ink)}

/* toolbar */
.tools{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.tools{grid-template-columns:2fr 1.2fr 1.2fr}}
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=month],select,textarea{width:100%;min-height:var(--tap);padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
select{appearance:auto}
textarea{min-height:96px;resize:vertical}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:var(--tap);border:2px solid var(--ink);border-radius:12px;font-weight:700;background:#fff;text-align:center;padding:0 8px}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--green);outline-offset:2px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.fchip{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:600;font-size:15px}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff}

/* youth list */
.ylist{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:640px){.ylist{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.ylist{grid-template-columns:repeat(3,1fr)}}
.ycard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:var(--tap)}
.ycard:hover{border-color:var(--ink)}
.ycard .nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.ycard .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink2)}
.ycard .bot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:32px 16px}
.empty h3{margin-bottom:8px}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* charts */
svg{max-width:100%;height:auto;display:block}
svg .grid{stroke:#e5dcc7;stroke-width:1}
svg .ax{font-size:10px;fill:#55575b}
svg .bar{fill:var(--purple)}
svg .bar.cur{fill:var(--green)}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.hb{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hb li{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;font-size:15px}
.hb .name{overflow-wrap:anywhere}
.track{height:14px;background:#ebe3d0;border-radius:8px;position:relative;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:8px}
.hb .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:48px}

/* tables */
.tw{width:100%}
table.rt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.rt th,table.rt td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
table.rt th{background:#efe7d4;font-weight:700}
table.rt th button{background:none;border:0;font-weight:700;padding:0;min-height:32px;text-align:left}
table.rt td.num,table.rt th.num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:700px){
  table.rt,table.rt tbody{display:block;border:0;background:none}
  table.rt thead{display:none}
  table.rt tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 12px}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border:0;text-align:right}
  table.rt td::before{content:attr(data-l);color:var(--ink2);font-size:13px;text-align:left}
  table.rt td.num{text-align:right}
  table.rt td.first{font-weight:700;font-size:16px;text-align:left}
  table.rt td.first::before{content:none}
}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--canvas);width:100%;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media(min-width:700px){.scrim{align-items:center}.sheet{max-width:680px;border-radius:20px;padding:24px}}
.sheet .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet .hd .x{flex:none;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:20px;line-height:1}
.field{margin-bottom:14px}
.row2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.err{color:var(--red);font-weight:700;margin-top:6px}
.pin{font-size:28px;letter-spacing:.4em;text-align:center}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.timeline .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:#ebe3d0}
.tag.risk{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:80;max-width:92vw;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.kv{display:grid;grid-template-columns:1fr;gap:6px 16px}
@media(min-width:560px){.kv{grid-template-columns:1fr 1fr}}
.kv div{font-size:15px}
.kv b{display:block;font-size:13px;color:var(--ink2);font-weight:600}
details.more{margin-top:10px}
details.more summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}

.mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
svg .tgt{stroke:#202124;stroke-width:1.3;stroke-dasharray:4 3}
.orgg{grid-template-columns:1fr}
@media(min-width:900px){.orgg{grid-template-columns:repeat(3,1fr)}}
.metric h3{font-size:17px;margin-bottom:8px}
.goals{display:grid;gap:10px;grid-template-columns:1fr;margin:0 0 26px}
@media(min-width:640px){.goals{grid-template-columns:repeat(3,1fr)}}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.goal b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1;color:var(--green-d)}
.goal span{display:block;font-size:15px;color:var(--ink2);margin-top:4px}
.sub{font-size:16px;color:var(--ink2);margin:-4px 0 12px}
.steps{margin:0 0 22px;padding-left:20px;color:var(--ink2)}
.steps li{margin:2px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.sb{border-left:4px solid var(--purple);padding-left:12px;margin:0 0 14px}
.sb[hidden],[hidden]{display:none!important}
h4.sec{font-family:var(--serif);font-size:17px;margin:18px 0 8px}

.lens h3{font-size:19px;margin-bottom:8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.lrow b{font-variant-numeric:tabular-nums}
.lrow .sub2{flex-basis:100%;font-size:13px;color:var(--ink2);margin-top:-4px}
.lens-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.lens-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.lens-grid{grid-template-columns:repeat(3,1fr)}}
.wk-wrap{display:grid;gap:4px}
.wkrow{display:grid;grid-template-columns:minmax(84px,1fr) repeat(8,minmax(26px,36px));gap:4px;align-items:center}
.wkrow .wn{font-size:14px;overflow-wrap:anywhere;line-height:1.25}
.wk,.wh{display:flex;align-items:center;justify-content:center;min-height:28px;border-radius:6px;font-size:11px;font-weight:700}
.wh{color:var(--ink2);font-weight:600}
.wh.cur{color:var(--ink);text-decoration:underline}
.wk.ok{background:var(--green);color:#fff}
.wk.no{background:#f4d9d9;color:#8a1c1c}
.wk.cur{outline:2px solid var(--ink)}
.pin{letter-spacing:.12em;font-size:22px}
.who{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:14px}
.who .chip{min-height:64px}

.home{max-width:980px}
.hero{display:grid;gap:20px;grid-template-columns:1fr;align-items:center}
@media(min-width:820px){.hero{grid-template-columns:1.15fr .85fr}}
.hero-img{background:#fbf6c8;border-radius:24px;padding:18px;display:flex;justify-content:center;align-items:center}
.hero-img img{height:min(52vw,260px);width:auto;max-width:100%}
@media(min-width:820px){.hero-img img{height:340px}}
.strip{margin-top:34px}
.strip h2{font-size:22px;margin-bottom:12px}
.figs{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.figs{grid-template-columns:repeat(3,1fr)}}
.fig{border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center}
.fig img{width:96px;height:auto;flex:none}
.fig b{display:block;font-family:var(--serif);font-size:18px;margin-bottom:2px}
.fig span{color:var(--ink2);font-size:15px;display:block}
@media(min-width:720px){.fig{flex-direction:column;text-align:center}.fig img{width:auto;height:170px}}
.howto{margin-top:30px}
.howto h3{margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(sel,root){return (root||document).querySelector(sel);}
function sha256(ascii){
  function rrot(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length,isComposite={},i,j;
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56){ascii+='\x00';}
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8){return '';}words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var temp1=hash[7]+(rrot(e,6)^rrot(e,11)^rrot(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rrot(w15,7)^rrot(w15,18)^(w15>>>3))+w[i-7]+(rrot(w2,17)^rrot(w2,19)^(w2>>>10)))|0);
      var temp2=(rrot(a,2)^rrot(a,13)^rrot(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
  }
  for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}
  return result;
}
function pinHash(scope,pin){return sha256(CONFIG.salt+'|'+scope+'|'+pin);}

/* dates are handled as local 'YYYY-MM-DD' strings */
function pad(n){return n<10?'0'+n:''+n;}
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromStr(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayStr(){return toStr(new Date());}
function addDays(s,n){var d=fromStr(s);d.setDate(d.getDate()+n);return toStr(d);}
function daysBetween(a,b){return Math.round((fromStr(b)-fromStr(a))/86400000);}
function weekStart(s){var d=fromStr(s),g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return toStr(d);}
function programmeYearStart(s){var d=fromStr(s),y=d.getFullYear(),m=CONFIG.programmeYearStartMonth;if(d.getMonth()+1<m){y--;}return y+'-'+pad(m)+'-01';}
function fmtDate(s){return fromStr(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtDateY(s){return fromStr(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function ago(days){
  if(days==null){return 'No contact logged';}
  if(days<=0){return 'Today';}
  if(days===1){return 'Yesterday';}
  if(days<14){return days+' days ago';}
  if(days<60){return Math.round(days/7)+' weeks ago';}
  return Math.round(days/30)+' months ago';
}
function fmtH(h){var r=Math.round(h*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1))+' h';}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function parseCSV(t){
  t=String(t).replace(/^\uFEFF/,'');
  var rows=[],r=[],c='',q=false,i,ch;
  for(i=0;i<t.length;i++){
    ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else{q=false;}}else{c+=ch;}}
    else if(ch==='"'){q=true;}
    else if(ch===','){r.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n'){i++;}r.push(c);rows.push(r);r=[];c='';}
    else{c+=ch;}
  }
  if(c!==''||r.length){r.push(c);rows.push(r);}
  return rows.filter(function(x){return x.some(function(v){return String(v).trim()!=='';});});
}
function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(head,rows){return [head.map(csvCell).join(',')].concat(rows.map(function(r){return r.map(csvCell).join(',');})).join('\n');}
function download(name,text){
  var b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

/* mapping sheet -> roster. Reports every row it could not use rather than dropping it silently. */
function wid(n){return 'W:'+String(n).toLowerCase().replace(/\s+/g,' ').trim();}
function rosterFromRows(rows){
  if(!rows.length){return {error:'The mapping sheet is empty.'};}
  var head=rows[0].map(function(h){return String(h).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();});
  function find(list){for(var i=0;i<head.length;i++){if(list.indexOf(head[i])>-1){return i;}}return -1;}
  var iName=find(['youth name','name of youth','full name','youth','name']);
  var iId=find(['youth id','mad id','mad code','youth code','id']);
  var iWn=find(['wingman name','wingman','wingman allocated','mentor','mentor name']);
  var iWi=find(['wingman id','wingman mad id','mentor id']);
  var iSt=find(['status']);
  var iSsg=find(['ssg name','ssg']);
  var iMar=find(['march status','pulse status','current status']);
  var iCourse=find(['course']);
  var iYear=find(['year stage','year of study']);
  if(iName<0){return {error:'No "Youth name" column found. Expected columns: youth_id, youth_name, wingman_name, ssg_name, status.'};}
  var out=[],seen={},rep={total:0,noWingman:0,dupes:0,blank:0,exited:0,generatedIds:0,withSsg:0};
  function cell(row,i){return i>-1?String(row[i]==null?'':row[i]).trim():'';}
  for(var r=1;r<rows.length;r++){
    var row=rows[r],name=cell(row,iName);
    if(!name){rep.blank++;continue;}
    rep.total++;
    var id=cell(row,iId);
    if(!id){id='ROW-'+pad(r);rep.generatedIds++;}
    if(seen[id]){rep.dupes++;continue;}
    seen[id]=1;
    var wn=cell(row,iWn),wi=cell(row,iWi);
    if(!wn){rep.noWingman++;}
    var st=cell(row,iSt).toLowerCase();
    var active=!(st==='exited'||st==='inactive'||st==='left'||st==='exit'||st==='no');
    if(!active){rep.exited++;}
    var ssg=cell(row,iSsg);if(ssg){rep.withSsg++;}
    out.push({youth_id:id,youth_name:name,wingman_id:wi||(wn?wid(wn):''),wingman_name:wn,ssg:ssg,march_status:cell(row,iMar),course:cell(row,iCourse),year_stage:cell(row,iYear),active:active});
  }
  return {roster:out,report:rep};
}
function reportText(rep){
  var p=['Read '+rep.total+' youth'];
  if(rep.noWingman){p.push(rep.noWingman+' without a Wingman');}
  if(rep.dupes){p.push(rep.dupes+' duplicate IDs skipped');}
  if(rep.exited){p.push(rep.exited+' marked exited');}
  if(rep.generatedIds){p.push(rep.generatedIds+' had no MAD ID, so a row ID was generated (use the MAD ID so records stay linked)');}
  return p.join('; ')+'.';
}
function applyRoster(ch,res,source){
  var meta0=getMeta(ch),old={},prev=getRoster(ch);
  prev.forEach(function(r){old[r.youth_id]=r.wingman_id;});
  var hist=(meta0.allocHistory||[]).slice(),today=todayStr();
  if(prev.length&&!meta0.demo){res.roster.forEach(function(r){var o=old[r.youth_id];if(o&&r.wingman_id&&o!==r.wingman_id){hist.push({youth_id:r.youth_id,from:o,to:r.wingman_id,date:today});}});}
  if(meta0.demo){hist=[];}
  setRoster(ch,res.roster);
  var ids={};res.roster.forEach(function(r){ids[r.youth_id]=1;});
  var orphan={};getLogs(ch).forEach(function(l){if(!ids[l.youth_id]){orphan[l.youth_id]=1;}});
  var m=getMeta(ch);m.demo=false;m.rosterAt=new Date().toISOString();m.rosterSource=source;m.report=res.report;m.orphans=Object.keys(orphan).length;m.prevCount=prev.length;m.allocHistory=hist;
  setMeta(ch,m);
}

/* ------------------------------------------------------------------ model */
function statusOf(y,days){
  if(!y.wingman_name){return 'none';}
  if(days==null){return 'lost';}
  if(days<=CONFIG.connection.connected){return 'connected';}
  if(days<=CONFIG.connection.slipping){return 'slipping';}
  if(days<=CONFIG.connection.atRisk){return 'atrisk';}
  return 'lost';
}
function buildModel(roster,logs,checks,Tov){
  var T=Tov||todayStr(),ws=weekStart(T),ms=T.slice(0,7)+'-01',ys=programmeYearStart(T),d30=addDays(T,-29);
  var curM=T.slice(0,7),prevM=addDays(ms,-1).slice(0,7),dom=+T.slice(8,10),ysM=ys.slice(0,7);
  var byY={};logs.forEach(function(l){(byY[l.youth_id]=byY[l.youth_id]||[]).push(l);});
  var ckBy={};checks.forEach(function(c){(ckBy[c.youth_id]=ckBy[c.youth_id]||[]).push(c);});
  var youth=roster.filter(function(r){return r.active!==false;}).map(function(r){
    var ls=(byY[r.youth_id]||[]).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.created_at<b.created_at?1:-1);});
    var done=ls.filter(function(l){return l.happened;});
    var last=done.length?done[0].date:null,days=last?daysBetween(last,T):null;
    function sum(f){return done.filter(function(l){return l.date>=f&&l.date<=T;}).reduce(function(a,l){return a+(+l.hours||0);},0);}
    function cnt(f){return done.filter(function(l){return l.date>=f&&l.date<=T;}).length;}
    var cks=(ckBy[r.youth_id]||[]).slice().sort(function(a,b){return a.month<b.month?-1:a.month>b.month?1:(a.created_at<b.created_at?-1:1);});
    var monthly=cks.filter(function(c){return c.kind!=='baseline';});
    var o={};for(var k in r){o[k]=r[k];}
    o.logs=ls;o.last=last;o.days=days;o.status=statusOf(r,days);
    o.h={week:sum(ws),month:sum(ms),d30:sum(d30),year:sum(ys)};
    o.n={week:cnt(ws),month:cnt(ms),d30:cnt(d30),year:cnt(ys)};
    o.checks=cks;o.check=cks.length?cks[cks.length-1]:null;
    o.baseline=!cks.some(function(c){return c.month>=ysM;});
    o.followup=null;
    for(var i=0;i<done.length;i++){
      var l=done[i];
      if(l.topic&&l.topic!=='Just checking in'){
        var answered=ls.some(function(x){return x.happened&&x.followup_to===l.id;});
        if(!answered){o.followup={log:l,due:T>=addDays(weekStart(l.date),7)};}
        break;
      }
    }
    o.reflectDue=!monthly.some(function(c){return c.month===curM;})&&dom>=24;
    o.reflectOverdue=!monthly.some(function(c){return c.month===prevM;})&&dom<=10&&done.some(function(l){return l.date.slice(0,7)===prevM;});
    return o;
  });
  return {youth:youth,T:T,ws:ws,ms:ms,ys:ys,d30:d30,logs:logs};
}
function weeklySeries(m,weeks){
  var out=[];
  for(var i=weeks-1;i>=0;i--){
    var a=addDays(m.ws,-7*i),b=addDays(a,6),n=0;
    m.youth.forEach(function(y){if(y.logs.some(function(l){return l.happened&&l.date>=a&&l.date<=b;})){n++;}});
    out.push({label:fmtDate(a),n:n,total:m.youth.length,pct:m.youth.length?n/m.youth.length*100:0});
  }
  return out;
}
function wingmanRows(m,period){
  var g={};
  m.youth.forEach(function(y){
    var key=y.wingman_id||'—';
    var w=g[key]=g[key]||{name:y.wingman_name||'No Wingman allocated',youth:0,sup:0,hours:0,last:null,flag:0};
    w.youth++;if(y.n.week>0){w.sup++;}w.hours+=y.h[period];
    if(y.last&&(!w.last||y.last>w.last)){w.last=y.last;}
    if(y.status==='atrisk'||y.status==='lost'){w.flag++;}
  });
  return Object.keys(g).map(function(k){var w=g[k];w.days=w.last?daysBetween(w.last,m.T):null;w.status=(k==='—')?'none':statusOf({wingman_name:w.name},w.days);return w;});
}

function histFor(ch){return getMeta(ch).allocHistory||[];}
function orgMetrics(m,hist){
  var Y=m.youth,n=Y.length,T=m.T,el=Math.min(1,(daysBetween(m.ys,T)+1)/365),thr=CONFIG.yearHoursTarget*el;
  var done25=Y.filter(function(y){return y.h.year>=CONFIG.yearHoursTarget;}).length;
  var pace=Y.filter(function(y){return y.h.year>=thr;}).length;
  var monN=Y.filter(function(y){return y.n.month>0;}).length;
  var withW=Y.filter(function(y){return y.wingman_id;});
  var chg={};hist.forEach(function(h){if(h.date>=m.ys){chg[h.youth_id]=1;}});
  var same=withW.filter(function(y){return !chg[y.youth_id];}).length;
  var series=[],d=m.ys.slice(0,7),end=T.slice(0,7);
  while(d<=end){
    var key=d,cnt=Y.filter(function(y){return y.logs.some(function(l){return l.happened&&l.date.slice(0,7)===key;});}).length;
    series.push({label:fromStr(key+'-01').toLocaleDateString('en-IN',{month:'short'}),n:cnt,total:n,pct:n?cnt/n*100:0});
    var p=d.split('-'),yy=+p[0],mm=+p[1]+1;if(mm>12){mm=1;yy++;}d=yy+'-'+pad(mm);
  }
  return {n:n,thr:thr,done25:done25,pace:pace,monN:monN,withW:withW.length,same:same,series:series};
}
function metricCard(title,val,target,sub,extra){
  var pct=val==null?null:Math.round(val*100),tp=Math.round(target*100);
  var st=pct==null?'Not measurable yet':(pct>=tp?'At or above target':'Below target');

    '<p class="small muted">'+sub+'</p>'+(extra||'')+'</div>';
}

  return '<div class="section"><h3>Year goals, June to May</h3><div class="grid orgg">'+c1+c2+c3+'</div></div>';

function doingCard(m){

}

/* ------------------------------------------------------------------ charts */
function chartBars(vals,aria,target){
  var W=360,H=172,pl=32,pb=26,pt=10,pr=6,iw=W-pl-pr,ih=H-pt-pb,bw=iw/Math.max(vals.length,1);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">';
  [0,50,100].forEach(function(g){var y=pt+ih-(g/100)*ih;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(pl-5)+'" y="'+(y+3)+'" class="ax" text-anchor="end">'+g+'%</text>';});
  vals.forEach(function(v,i){
    var h=(v.pct/100)*ih,x=pl+i*bw+bw*.16,w=bw*.68,y=pt+ih-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,1)+'" rx="3" class="bar'+(i===vals.length-1?' cur':'')+'"><title>'+esc(v.label)+': '+v.n+' of '+v.total+' youth ('+Math.round(v.pct)+'%)</title></rect>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-9)+'" class="ax" text-anchor="middle">'+esc(v.label)+'</text>';
  });
  if(target!=null){var ty=pt+ih-(target/100)*ih;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ty+'" y2="'+ty+'" class="tgt"/><text x="'+(W-pr)+'" y="'+(ty-3)+'" class="ax" text-anchor="end">target '+Math.round(target)+'%</text>';}
  return s+'</svg>';
}
function chartWeekly(vals){return chartBars(vals,'Share of youth with a Wingman interaction in each of the last '+vals.length+' weeks',null);}
function chartDonut(counts){
  var keys=['connected','slipping','atrisk','lost','none'],total=0;
  keys.forEach(function(k){total+=counts[k]||0;});
  var R=52,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Youth by connection status"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#ebe3d0" stroke-width="20"/>';
  if(total){keys.forEach(function(k){var n=counts[k]||0;if(!n){return;}var len=n/total*C;s+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+STATUS[k].color+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;});}
  s+='<text x="70" y="68" text-anchor="middle" font-size="26" font-family="Georgia,serif" font-weight="700" fill="#202124">'+total+'</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#55575b">youth</text></svg>';

/* ------------------------------------------------------------------ sync */
async function apiCall(action,ch,pin,body){
  var base=CONFIG.endpoint;
  if(body){
    var r=await fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,chapter:ch,pin:pin},body))});
    if(!r.ok){throw new Error('Sheet returned '+r.status);}
    return r.json();
  }
  var u=base+(base.indexOf('?')>-1?'&':'?')+new URLSearchParams({action:action,chapter:ch||'',pin:pin||''}).toString();
  var r2=await fetch(u);
  if(!r2.ok){throw new Error('Sheet returned '+r2.status);}
  return r2.json();
}
function pendingCount(ch){
  return getLogs(ch).filter(function(l){return !l.synced;}).length+getChecks(ch).filter(function(c){return !c.synced;}).length;
}
async function syncNow(ch,quiet){
  if(!CONFIG.endpoint){if(!quiet){toast('No Google Sheet is connected yet. Entries are saved on this device and can be exported as CSV.');}return false;}
  var ses=getSession();if(!ses){return false;}
  try{
    var logs=getLogs(ch),checks=getChecks(ch);
    var pl=logs.filter(function(l){return !l.synced;}),pc=checks.filter(function(c){return !c.synced;});
    if(pl.length||pc.length){
      var res=await apiCall('push',ch,ses.pin,{logs:pl,checkins:pc});
      if(!res||!res.ok){throw new Error((res&&res.error)||'Push failed');}
      var ok={};(res.saved||[]).forEach(function(i){ok[i]=1;});
      logs.forEach(function(l){if(ok[l.id]){l.synced=true;}});checks.forEach(function(c){if(ok[c.id]){c.synced=true;}});
      setLogs(ch,logs);setChecks(ch,checks);
    }
    var pull=await apiCall('sync',ch,ses.pin);
    if(pull&&pull.ok){
      var have={};getLogs(ch).forEach(function(l){have[l.id]=1;});
      var L=getLogs(ch);(pull.logs||[]).forEach(function(l){if(!have[l.id]){l.synced=true;L.push(l);}});setLogs(ch,L);
      var hc={};getChecks(ch).forEach(function(c){hc[c.id]=1;});
      var C=getChecks(ch);(pull.checkins||[]).forEach(function(c){if(!hc[c.id]){c.synced=true;C.push(c);}});setChecks(ch,C);
    }
    var m=getMeta(ch);m.syncedAt=new Date().toISOString();m.syncErr='';setMeta(ch,m);
    if(!quiet){toast('Synced with the Google Sheet.');}
    return true;
  }catch(e){
    var m2=getMeta(ch);m2.syncErr=String(e.message||e);setMeta(ch,m2);
    if(!quiet){toast('Could not reach the Google Sheet. Your entries are safe on this device and will sync later.');}
    return false;
  }
}
async function refreshMapping(ch,quiet){
  var ses=getSession(),url=CONFIG.mappingCsv[ch],res,j=null;
  try{
    if(url){
      var r=await fetch(url,{cache:'no-store'});if(!r.ok){throw new Error('Mapping sheet returned '+r.status);}
      res=rosterFromRows(parseCSV(await r.text()));
    }else if(CONFIG.endpoint){
      j=await apiCall('roster',ch,ses&&ses.pin);
      if(!j||!j.ok){throw new Error((j&&j.error)||'Could not read the mapping tab');}
      res=rosterFromRows([MAP_HEAD].concat((j.rows||[])));
    }else{
      if(!quiet){toast('No mapping sheet is connected for this chapter yet. Import a CSV in the Data tab.');}
      return false;
    }
    if(res.error){throw new Error(res.error);}
    applyRoster(ch,res,url?'Published CSV':'Aftercare Beats master sheet');
    if(!url&&CONFIG.endpoint){var mm=getMeta(ch);mm.allocHistory=((j&&j.history)||[]).map(function(h){return {youth_id:h.youth_id,from:h.from,to:h.to,date:h.changed_on};});setMeta(ch,mm);}
    if(!quiet){toast('Mapping updated. '+reportText(res.report));}
    return true;
  }catch(e){
    if(!quiet){toast('Mapping not updated: '+(e.message||e));}
    return false;
  }
}

    roster.push({youth_id:'DEMO-'+pad(i),youth_name:'Demo Youth '+i,wingman_id:'DEMO-W'+w,wingman_name:'Demo Wingman '+w,age_band:i%3===0?'22-25':'18-21',ssg:'',active:true});

      if(rnd()<0.16){
        var date=addDays(T,-d);

      }
    }
  });
  setRoster(ch,roster);setLogs(ch,logs);setChecks(ch,[]);
  var m=getMeta(ch);m.demo=true;m.rosterAt=new Date().toISOString();m.rosterSource='Demo data (fictional)';m.report=null;m.orphans=0;setMeta(ch,m);
}

function renderWho(){
  var ch=S.chapter,roster=getRoster(ch).filter(function(r){return r.active!==false;}),wm={};
  roster.forEach(function(r){if(r.wingman_id){wm[r.wingman_id]=wm[r.wingman_id]||{name:r.wingman_name,n:0};wm[r.wingman_id].n++;}});
  var keys=Object.keys(wm).sort(function(a,b){return wm[a].name.localeCompare(wm[b].name);});
  var list=keys.length?'<div class="who">'+keys.map(function(k){return '<button class="chip" data-a="pick-me" data-w="'+esc(k)+'">'+esc(wm[k].name)+'<br><span class="small muted">'+(k.indexOf('W:')===0?'':esc(k)+'. ')+wm[k].n+' youth</span></button>';}).join('')+'</div>':
    '<div class="banner" style="margin-top:14px">'+(roster.length?'No Wingman names are mapped in this chapter yet. Add them in the Wingman Name column of the Aftercare Beats sheet. Until then only the chapter team view works.':'The mapping is still loading. If this stays empty, ask the chapter team to refresh the mapping.')+'</div>';
  return '<header class="top"><div class="row"><button class="iconbtn" data-a="home" aria-label="Back to chapters">&#8592;</button><h2>'+esc(ch)+'</h2></div></header><main class="page"><h2>Who are you?</h2><p class="muted" style="margin:6px 0 4px">You will only see the youth mapped to you. Choose your name.</p>'+list+
    '<div class="section"><h3>Not a Wingman?</h3><p class="muted small" style="margin:4px 0 10px">The chapter team sees every youth in the chapter, the dashboard and the data tools. It needs the CHO password.</p><button class="btn ghost" data-a="pick-me" data-team="1">Chapter team (CHO)</button></div></main>'+modalHtml();
}

function isTeam(){return !S.me||S.me.role==='team';}
function tabsHtml(){
  var t=isTeam()?[['week','This week'],['youth','Youth'],['dash','Dashboard'],['data','Data']]:[['week','This week'],['youth','My youth'],['dash','My numbers']];
  return '<nav class="tabs" role="tablist" aria-label="Sections">'+t.map(function(x){return '<button role="tab" aria-selected="'+(S.tab===x[0])+'" data-a="tab" data-t="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</nav>';
}
function syncPillHtml(ch){
  var meta=getMeta(ch),p=pendingCount(ch),txt;
  if(!CONFIG.endpoint){txt=p?p+' saved on this device':'Saved on this device';}
  else if(meta.syncErr){txt=p+' waiting to sync';}
  else if(p){txt=p+' waiting to sync';}
  else if(meta.syncedAt){txt='Synced '+new Date(meta.syncedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
  else{txt='Not synced yet';}
  return '<button class="pill sync" data-a="sync" aria-label="Sync now. '+esc(txt)+'">'+esc(txt)+'</button>';
}
function shell(inner,title){
  var inCh=S.view==='chapter';
  return '<header class="top"><div class="row"><button class="iconbtn" data-a="home" aria-label="Back to chapters">&#8592;</button><h2>'+esc(title)+'</h2>'+(inCh?syncPillHtml(S.chapter):'')+(inCh?'<button class="iconbtn" data-a="switch-user" aria-label="Change user">Switch</button>':'')+(inCh?tabsHtml():'')+'</div></header><main class="page" id="page">'+inner+'</main>'+modalHtml();
}

function renderChapter(){
  var ch=S.chapter,inner;
  if(!isTeam()&&S.tab==='data'){S.tab='week';}
  if(S.tab==='week'){inner=weekTab(ch);}
  else if(S.tab==='youth'){inner=youthTab(ch);}
  else if(S.tab==='dash'){inner=dashTab(ch);}
  else{inner=dataTab(ch);}
  return shell(inner,S.me&&S.me.role==='wingman'?S.me.name+', '+ch:ch+' chapter team');
}

function emptyState(ch){
  var meta=getMeta(ch);
  if(!isTeam()){return '<div class="card empty"><h3>No youth are mapped to you yet</h3><p class="muted">Your CHO maps youth to Wingmen in the Aftercare Beats sheet. They appear here after the next sync.</p><div class="acts"><button class="btn" data-a="refresh-map">Refresh now</button></div></div>';}
  return '<div class="card empty"><h3>No youth are mapped to this chapter yet</h3><p class="muted">Each chapter keeps its youth and Wingman in the Aftercare Beats sheet. Once it is filled in, it appears here.</p>'+
    '<div class="acts"><button class="btn" data-a="refresh-map">Refresh the mapping now</button><button class="btn ghost" data-a="import">Import a CSV</button><button class="btn ghost" data-a="demo">Try with demo data</button></div>'+
    (meta.syncErr?'<p class="err small">'+esc(meta.syncErr)+'</p>':'')+'</div>';
}
function myRoster(ch){
  var r=getRoster(ch).filter(function(x){return x.active!==false;});
  if(S.me&&S.me.role==='wingman'){r=r.filter(function(x){return x.wingman_id===S.me.id;});}
  return r;
}
function todoTags(y){
  var t=[];
  if(y.baseline){t.push('<span class="tag">First conversation: record what they are doing</span>');}
  if(y.followup&&y.followup.due){t.push('<span class="tag">Follow up: '+esc(y.followup.log.topic)+'</span>');}
  if(y.reflectDue||y.reflectOverdue){t.push('<span class="tag">Month check-in and reflection due</span>');}
  if(y.n.week===0){t.push('<span class="tag">No conversation this week yet</span>');}
  return '<div class="tags">'+t.join('')+'</div>';
}
function noWingmanBanner(m){
  if(m.youth.length&&m.youth.every(function(y){return !y.wingman_name;})){return '<div class="banner">No youth in this chapter has a Wingman in the mapping yet. Add the names in the Wingman Name column of the Aftercare Beats sheet. They appear here after the next sync.</div>';}
  return '';
}
function weekTab(ch){
  var roster=myRoster(ch);
  if(!roster.length){return emptyState(ch);}
  var m=buildModel(roster,getLogs(ch),getChecks(ch)),mine=m.youth;
  var talked=mine.filter(function(y){return y.n.week>0;}).length;
  var fu=mine.filter(function(y){return y.followup&&y.followup.due;}).length;
  var due=mine.filter(function(y){return y.baseline||y.reflectDue||y.reflectOverdue;}).length;
  var disc=mine.filter(function(y){return y.status==='atrisk'||y.status==='lost';}).sort(function(a,b){return (b.days==null?99999:b.days)-(a.days==null?99999:a.days)||a.youth_name.localeCompare(b.youth_name);});
  var todo=mine.filter(function(y){return y.n.week===0||(y.followup&&y.followup.due)||y.reflectDue||y.reflectOverdue||y.baseline;}).sort(function(a,b){var x=a.days==null?99999:a.days,y2=b.days==null?99999:b.days;return (y2-x)||a.youth_name.localeCompare(b.youth_name);});
  var cards=todo.length?'<div class="ylist">'+todo.map(function(y){
    return '<div class="ycard" role="group" aria-label="'+esc(y.youth_name)+'"><button class="link" style="text-decoration:none;text-align:left;padding:0;min-height:0;display:block" data-a="youth" data-id="'+esc(y.youth_id)+'"><span class="nm">'+esc(y.youth_name)+'</span></button>'+todoTags(y)+
      '<div class="meta"><span>Wingman: '+esc(y.wingman_name||'not allocated')+'</span><span>Last: '+esc(ago(y.days))+'</span></div>'+
      '<div class="bot">'+statusPill(y.status)+'<span style="display:flex;gap:8px;flex-wrap:wrap">'+((y.reflectDue||y.reflectOverdue)?'<button class="btn ghost sm" data-a="check" data-id="'+esc(y.youth_id)+'">Check-in</button>':'')+'<button class="btn sm" data-a="log" data-id="'+esc(y.youth_id)+'">Log</button></span></div></div>';
  }).join('')+'</div>':'<div class="card empty"><h3>All caught up</h3><p class="muted">Everyone has had a conversation this week and nothing is waiting.</p></div>';
  var discHtml=disc.length?'<div class="section"><h3>Disconnected and at risk</h3><p class="small muted" style="margin-bottom:8px">No conversation for more than '+CONFIG.connection.slipping+' days.</p><ul class="timeline">'+disc.map(function(y){return '<li><div class="t"><span><button class="link" style="padding:0;text-align:left;font-weight:700" data-a="youth" data-id="'+esc(y.youth_id)+'">'+esc(y.youth_name)+'</button></span><span>'+statusPill(y.status)+'</span></div><span class="small muted">Last conversation: '+esc(ago(y.days))+'. Wingman: '+esc(y.wingman_name||'not allocated')+'.</span><div style="margin-top:8px"><button class="btn sm" data-a="log" data-id="'+esc(y.youth_id)+'">Log</button></div></li>';}).join('')+'</ul></div>':'';
  var banner=getMeta(ch).demo?'<div class="banner">This chapter is showing fictional demo data. Import the real mapping in the Data tab to replace it.</div>':'';

function weekGrid(m,weeks){
  var starts=[],i;for(i=weeks-1;i>=0;i--){starts.push(addDays(m.ws,-7*i));}
  return m.youth.map(function(y){
    var done=y.logs.filter(function(l){return l.happened;});
    var cells=starts.map(function(a){var e=addDays(a,6),h=0,n=0;done.forEach(function(l){if(l.date>=a&&l.date<=e){h+=(+l.hours||0);n++;}});return {a:a,n:n,h:h};});
    var streak=0,j;for(j=cells.length-1;j>=0;j--){if(cells[j].n===0){streak++;}else{break;}}
    return {y:y,cells:cells,streak:streak};
  });
}

function nameOf(Y,id){for(var i=0;i<Y.length;i++){if(Y[i].youth_id===id){return Y[i].youth_name;}}return id;}
function sortRows(Y,P){
  var k=S.sort.k,d=S.sort.d,ord={connected:0,slipping:1,atrisk:2,lost:3,none:4};
  return Y.slice().sort(function(a,b){
    var x,y;
    if(k==='name'){return a.youth_name.localeCompare(b.youth_name)*d;}
    if(k==='wingman'){return (a.wingman_name||'~').localeCompare(b.wingman_name||'~')*d;}
    if(k==='n'){x=a.n[P];y=b.n[P];}
    else if(k==='hours'){x=a.h[P];y=b.h[P];}
    else if(k==='year'){x=a.h.year;y=b.h.year;}
    else if(k==='days'){x=a.days==null?99999:a.days;y=b.days==null?99999:b.days;}
    else{x=ord[a.status];y=ord[b.status];}
    return (x-y)*d||a.youth_name.localeCompare(b.youth_name);
  });
}

function validate(f){
  var els=f.querySelectorAll('[data-req]');

    var fld=e.closest('.field'),lb=fld&&fld.querySelector('.f'),lab=lb?lb.textContent.replace(/\s*\(.*\)\s*$/,''):'this question';

    '<div class="grid kpis">'+kpiCard(tot.n,'Youth mapped ('+tot.withW+' with a Wingman)')+kpiCard(pctOf(tot.sup,tot.n)+'%','Weekly support ('+tot.sup+' of '+tot.n+' expected)')+kpiCard(fmtH(tot.hw),'Support hours this week')+kpiCard(pctOf(tot.monN,tot.n)+'%','Monthly support ('+tot.monN+' of '+tot.n+')')+
      kpiCard(tot.done4+' of '+tot.exp4,'Conversations done vs expected, last 4 weeks')+kpiCard(tot.conc,'Concerns flagged, last 14 days')+kpiCard(tot.bad,'At risk or disconnected')+kpiCard(tot.n-tot.withW,'Youth without a Wingman')+'</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'+(CONFIG.endpoint?'<button class="btn" data-a="admin-load">Load from the sheet</button>':'')+'<button class="btn ghost" data-a="exp-all">Export all youth summary (CSV)</button></div>'+
    '<div class="section"><h3>Where we are against the year goals</h3>'+goals+'</div>'+
    '<div class="section"><h3>Chapter by chapter</h3>'+filters+cards+'</div>'+
    '<div class="section"><h3>Comparison</h3>'+table+'</div>';
  return head('Programme dashboard')+'<main class="page">'+inner+'</main>'+modalHtml();
}

/* ------------------------------------------------------------------ render */
function render(){
  var app=$('#app'),html;
  if(S.view==='home'){html=renderHome();}
  else if(S.view==='who'){html=renderWho();}
  else if(S.view==='admin'){html=renderAdmin();}
  else{html=renderChapter();}
  app.innerHTML=html;
  afterRender();
}
function afterRender(){
  if(S.modal){
    var f=$('.sheet input:not([type=radio]),.sheet select');
    if(f&&!S._focused){f.focus({preventScroll:true});S._focused=true;}
    var lf=$('#logform');if(lf){toggleLog();}
    var cf=$('#checkform');if(cf){toggleStatus(cf);}
  }
}
function setModal(m){S.modal=m;S._focused=false;render();}

/* ------------------------------------------------------------------ actions */
function enterChapter(ch,pin){
  setSession({chapter:ch,pin:pin,role:'chapter',me:null});
  S.view='who';S.chapter=ch;S.me=null;S.tab='week';S.q='';S.wm='all';S.conn='all';S._wmTouched=false;S.modal=null;S.pinErr='';
  render();
  window.scrollTo(0,0);
  refreshMapping(ch,true).then(function(){return syncNow(ch,true);}).then(function(){if((S.view==='who'||S.view==='chapter')&&S.chapter===ch&&!S.modal){render();}});
}
function lockKey(scope){return 'mad.wst.lock.'+scope;}
async function submitPin(pin){
  var scope=S.modal.scope,lk=sget(lockKey(scope),{n:0,until:0});
  if(Date.now()<lk.until){S.pinErr='Too many wrong tries. Try again in '+Math.ceil((lk.until-Date.now())/1000)+' seconds.';render();return;}
  S.busy=true;render();
  var ok=false;
  if(!CONFIG.endpoint){S.busy=false;S.pinErr='The app is not connected to the Google Sheet yet. Ask the programme team.';render();return;}
  try{
    var j=scope==='cho'?await apiCall('auth-cho',S.chapter,pin):await apiCall('auth',scope==='admin'?'Programme team':scope,pin);
    ok=!!(j&&j.ok);
    if(j&&j.locked){S.busy=false;S.pinErr='Too many wrong tries. Please wait 15 minutes and try again.';render();return;}
  }catch(e){
    S.busy=false;S.pinErr='Could not reach the server. Check your internet connection and try again.';render();return;
  }
  S.busy=false;
  if(!ok){
    lk.n=(lk.n||0)+1;if(lk.n>=5){lk.until=Date.now()+60000;lk.n=0;}
    sset(lockKey(scope),lk);S.pinErr='That password is not right. Check it with your CHO.';render();var p=$('#pin');if(p){p.focus();}return;
  }
  sset(lockKey(scope),{n:0,until:0});
  if(scope==='admin'){
    setSession({chapter:null,pin:pin,role:'admin'});S.view='admin';S.adminChapter=null;S.modal=null;S.pinErr='';S.adminData=null;render();window.scrollTo(0,0);
  }else if(scope==='cho'){
    S.me={role:'team'};var cs=getSession();if(cs){cs.me=S.me;setSession(cs);}
    S.modal=null;S.pinErr='';S.view='chapter';S.tab='week';S.wm='all';S.conn='all';S.q='';render();window.scrollTo(0,0);
  }else{enterChapter(scope,pin);}
}
function fv(f,n){var e=f.querySelector('[name="'+n+'"]');return e?e.value:'';}
function radio(f,n){var e=f.querySelector('input[name="'+n+'"]:checked');return e?e.value:'';}
function getv(f,n){var e=f.querySelector('[name="'+n+'"]');return (e&&!e.closest('[hidden]'))?e.value:'';}
function emptyCheck(){var o={};CHECK_KEYS.forEach(function(k){o[k]='';});return o;}
function statusFields(f){
  var o={};['doing','study_level','study_year','study_track','study_challenge','work_type','salary_band','cv','job_plan','practice_interview','barrier'].forEach(function(k){o[k]=getv(f,k);});
  o.job_90_days=getv(f,'job90');return o;
}
function toggleLog(){
  var f=$('#logform');if(!f){return;}
  var yes=radio(f,'happened')==='yes';
  $('#yesbox').hidden=!yes;$('#nobox').hidden=yes;
  var msgs=yes&&fv(f,'mode')==='Messages';
  $('#replybox').hidden=!msgs;
  $('#convbox').hidden=msgs&&fv(f,'reply')==='No reply yet';
  toggleStatus(f);
}
function saveLog(){
  var f=$('#logform'),ch=S.chapter,id=S.modal.id,err=$('#logerr'),g=getYouth(id);if(!g){return;}
  function fail(t){err.textContent=t;err.hidden=false;}
  var date=fv(f,'date'),happened=radio(f,'happened')==='yes',w=fv(f,'wingman');
  if(date&&date>todayStr()){return fail('Choose a date that is today or earlier.');}
  var msg=validate(f);if(msg){return fail(msg);}
  var noReply=happened&&fv(f,'mode')==='Messages'&&fv(f,'reply')==='No reply yet';
  if(noReply){happened=false;}
  var wname='';wingmenOf(ch).forEach(function(x){if(x[0]===w){wname=x[1];}});
  var fu=g.y.followup&&g.y.followup.due&&happened?g.y.followup:null;
  var now=new Date().toISOString();
  var rec={id:uid(),chapter:ch,youth_id:id,youth_name:g.y.youth_name,wingman_id:w,wingman_name:wname,date:date,happened:happened,reason:happened?'':(noReply?'Message sent, no reply':fv(f,'reason')),mode:(happened||noReply)?fv(f,'mode'):'',hours:happened?+fv(f,'hours'):0,topic:happened?fv(f,'topic'):'',summary:happened?fv(f,'summary').trim():'',risk:fv(f,'risk'),followup_to:fu?fu.log.id:'',followup_status:fu?getv(f,'fu_status'):'',created_at:now,synced:false};
  var L=getLogs(ch);L.push(rec);setLogs(ch,L);
  if(happened&&g.y.baseline){
    var C=getChecks(ch);
    C.push(Object.assign(emptyCheck(),statusFields(f),{id:uid(),chapter:ch,youth_id:id,youth_name:g.y.youth_name,wingman_id:w,wingman_name:wname,month:date.slice(0,7),kind:'baseline',created_at:now,synced:false}));
    setChecks(ch,C);
  }
  sset(K('me',ch),w);
  S.modal=S.modal.back?{type:'youth',id:id}:null;S._focused=false;render();
  toast(happened?'Interaction saved.':(noReply?'Saved. A message with no reply does not count as a conversation yet.':'Saved as an interaction that did not happen.'));
  syncNow(ch,true).then(function(){if(S.view==='chapter'){var p=$('.top .pill.sync');if(p){p.outerHTML=syncPillHtml(ch);}}});
}
function saveCheck(){
  var f=$('#checkform'),ch=S.chapter,id=S.modal.id,err=$('#checkerr'),g=getYouth(id);if(!g){return;}
  function fail(t){err.textContent=t;err.hidden=false;}
  var msg=validate(f);if(msg){return fail(msg);}
  var w=fv(f,'wingman'),wname='';wingmenOf(ch).forEach(function(x){if(x[0]===w){wname=x[1];}});
  var rec=Object.assign(emptyCheck(),statusFields(f),{housing:fv(f,'housing'),money:fv(f,'money'),independence:fv(f,'independence'),family_income:fv(f,'family_income'),documents:fv(f,'documents'),plan:fv(f,'plan'),progress:fv(f,'progress'),connection:fv(f,'connection'),next_support:fv(f,'next_support'),wm_support:fv(f,'wm_support'),reflection:fv(f,'reflection').trim(),id:uid(),chapter:ch,youth_id:id,youth_name:g.y.youth_name,wingman_id:w,wingman_name:wname,month:fv(f,'month'),kind:'monthly',created_at:new Date().toISOString(),synced:false});
  var C=getChecks(ch);C.push(rec);setChecks(ch,C);
  S.modal=S.modal.back?{type:'youth',id:id}:null;S._focused=false;render();toast('Check-in saved.');
  syncNow(ch,true);
}
function summaryRows(Y,ch){
  return Y.map(function(y){return [ch,y.youth_id,y.youth_name,y.wingman_name||'',y.n.week,Math.round(y.h.week*10)/10,Math.round(y.h.month*10)/10,Math.round(y.h.year*10)/10,y.last||'',y.days==null?'':y.days,STATUS[y.status].label];});
}
var SUM_HEAD=['Chapter','Youth ID','Youth','Wingman','Interactions this week','Hours this week','Hours this month','Hours this programme year','Last interaction','Days since','Connection'];

function act(a,d,el,ev){
  var ch=S.chapter;
  switch(a){
    case 'pick-me':
      if(d.team){S.pinErr='';setModal({type:'pin',scope:'cho'});break;}
      var pmN='';
      getRoster(ch).forEach(function(r){if(r.wingman_id===d.w){pmN=r.wingman_name;}});
      S.me={role:'wingman',id:d.w,name:pmN};
      var pmS=getSession();if(pmS){pmS.me=S.me;setSession(pmS);}
      S.view='chapter';S.tab='week';S.wm='all';S.conn='all';S.q='';render();window.scrollTo(0,0);break;
    case 'switch-user':
      S.me=null;var suS=getSession();if(suS){suS.me=null;setSession(suS);}
      S.view='who';S.modal=null;render();break;
    case 'admin-chapter':S.adminChapter=d.ch;render();window.scrollTo(0,0);break;
    case 'admin-back':S.adminChapter=null;render();window.scrollTo(0,0);break;
    case 'toggle-chapters':S.open=!S.open;render();if(S.open){var c=$('.chip');if(c){c.focus();}}break;
    case 'pick':S.pinErr='';setModal({type:'pin',scope:d.ch});break;
    case 'admin':S.pinErr='';setModal({type:'pin',scope:'admin'});break;
    case 'home':setSession(null);S.view='home';S.chapter=null;S.me=null;S.adminChapter=null;S.modal=null;render();window.scrollTo(0,0);break;
    case 'close':S.modal=(S.modal&&(S.modal.type==='log'||S.modal.type==='check')&&S.modal.back)?{type:'youth',id:S.modal.id}:null;S._focused=false;render();break;
    case 'scrim':if(ev.target===el){act('close',d,el,ev);}break;
    case 'tab':S.tab=d.t;render();window.scrollTo(0,0);break;
    case 'conn':S.conn=d.c;render();break;
    case 'youth':setModal({type:'youth',id:d.id});break;
    case 'log':setModal({type:'log',id:d.id,back:!!(S.modal&&S.modal.type==='youth')});break;
    case 'check':setModal({type:'check',id:d.id,back:!!(S.modal&&S.modal.type==='youth')});break;
    case 'sort':if(S.sort.k===d.k){S.sort.d*=-1;}else{S.sort={k:d.k,d:1};}render();break;
    case 'rm-log':var L=getLogs(ch).filter(function(l){return l.id!==d.lid||l.synced;});setLogs(ch,L);render();toast('Entry removed.');break;
    case 'sync':syncNow(ch,false).then(function(){render();});break;
    case 'refresh-map':refreshMapping(ch,false).then(function(){render();});break;
    case 'import':$('#filepick').click();break;
    case 'demo':makeDemo(ch);render();toast('Demo data loaded. It is fictional.');break;
    case 'template':download('mapping_template.csv',toCSV(['youth_id','youth_name','wingman_id','wingman_name','ssg_name','status','march_status','course','year_stage'],[['B-000000','Example Youth','WM-001','Example Wingman','Example SSG 1','Active','Studying','BA','2nd year']]));break;
    case 'exp-logs':
      download(ch+'_interactions.csv',toCSV(['id','chapter','youth_id','youth_name','wingman_id','wingman_name','date','week_start','happened','reason','mode','hours','topic','summary','risk','followup_to','followup_status','created_at'],getLogs(ch).map(function(l){return [l.id,l.chapter,l.youth_id,l.youth_name,l.wingman_id,l.wingman_name,l.date,weekStart(l.date),l.happened?'Yes':'No',l.reason,l.mode,l.hours,l.topic,l.summary,l.risk,l.followup_to||'',l.followup_status||'',l.created_at];})));break;
    case 'exp-checks':
      download(ch+'_checkins.csv',toCSV(['id','chapter','youth_id','youth_name','wingman_id','wingman_name','month','kind'].concat(CHECK_KEYS).concat(['created_at']),getChecks(ch).map(function(c){return [c.id,c.chapter,c.youth_id,c.youth_name,c.wingman_id,c.wingman_name,c.month,c.kind||'monthly'].concat(CHECK_KEYS.map(function(k){return c[k]||'';})).concat([c.created_at]);})));break;
    case 'exp-youth':
      var mm=buildModel(getRoster(ch),getLogs(ch),getChecks(ch));download(ch+'_youth_summary.csv',toCSV(SUM_HEAD,summaryRows(mm.youth,ch)));break;
    case 'exp-all':
      var all=[];CHAPTERS.forEach(function(c){var src=S.adminData&&S.adminData[c]?S.adminData[c]:{roster:getRoster(c),logs:getLogs(c),checks:getChecks(c)};all=all.concat(summaryRows(buildModel(src.roster,src.logs,src.checks||[]).youth,c));});
      download('all_chapters_youth_summary.csv',toCSV(SUM_HEAD,all));break;
    case 'clear':
      if(window.confirm('Remove all entries and the mapping saved on this device for '+ch+'? Anything not yet synced will be lost.')){[ 'roster','logs','checks','meta'].forEach(function(t){sdel(K(t,ch));});render();toast('Cleared on this device.');}break;
    case 'admin-load':
      var ses=getSession();toast('Loading from the sheet');
      apiCall('all','Programme team',ses&&ses.pin).then(function(j){
        if(!j||!j.ok){throw new Error((j&&j.error)||'Could not load');}
        var out={};CHAPTERS.forEach(function(c){var rr=rosterFromRows([MAP_HEAD].concat(((j.rosters||{})[c])||[]));out[c]={roster:rr.roster||[],logs:(j.logs||[]).filter(function(l){return l.chapter===c;}),checks:(j.checkins||[]).filter(function(l){return l.chapter===c;}),history:(j.history||[]).filter(function(h){return h.chapter===c;}).map(function(h){return {youth_id:h.youth_id,from:h.from,to:h.to,date:h.changed_on};})};});
        S.adminData=out;render();toast('Loaded all chapters.');
      }).catch(function(e){toast('Could not load: '+(e.message||e));});break;
  }
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t){return;}
  if(t.dataset.a==='scrim'&&e.target!==t){return;}
  act(t.dataset.a,t.dataset,t,e);
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='pinform'){submitPin($('#pin').value.trim());}
  else if(e.target.id==='logform'){saveLog();}
  else if(e.target.id==='checkform'){saveCheck();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='happened'||t.name==='mode'||t.name==='reply'){toggleLog();}
  else if(t.name==='doing'){toggleStatus(t.form);}
  else if(t.id==='wmsel'){S.wm=t.value;S._wmTouched=true;render();}
  else if(t.id==='mesel'){sset(K('me',S.chapter),t.value);S.wm=t.value;S._wmTouched=true;render();}
  else if(t.id==='period'){S.period=t.value;render();}
  else if(t.id==='af_ch'){S.af.ch=t.value;render();}
  else if(t.id==='af_need'){S.af.need=t.value;render();}
  else if(t.id==='af_sort'){S.af.sort=t.value;render();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){
    S.q=e.target.value;
    var ch=S.chapter,m=buildModel(myRoster(ch),getLogs(ch),getChecks(ch));
    $('#ylist').innerHTML=youthCards(m);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal){act('close',{},null,e);}
});
$('#filepick').addEventListener('change',function(e){
  var file=e.target.files&&e.target.files[0];if(!file){return;}
  var r=new FileReader(),ch=S.chapter;
  r.onload=function(){
    var res=rosterFromRows(parseCSV(r.result));
    if(res.error){toast(res.error);}
    else{applyRoster(ch,res,'Imported CSV ('+file.name+')');render();toast('Mapping imported. '+reportText(res.report));}
    e.target.value='';
  };
  r.readAsText(file);
});
window.addEventListener('online',function(){if(S.view==='chapter'){syncNow(S.chapter,true).then(function(){var p=$('.top .pill.sync');if(p){p.outerHTML=syncPillHtml(S.chapter);}});}});

/* restore an open session (same browser tab) */
(function(){
  var ses=getSession();
  if(ses&&ses.role==='chapter'&&ses.chapter&&CHAPTERS.indexOf(ses.chapter)>-1){S.chapter=ses.chapter;S.me=ses.me||null;S.view=S.me?'chapter':'who';}
  else if(ses&&ses.role==='admin'){S.view='admin';}
  document.title='MAD Connect: keeping every Wingman and youth connected';
  render();
})();

})();
</script>
